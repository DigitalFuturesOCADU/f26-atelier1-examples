<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3 Both Ways (three.js)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141414; }
    #connect { position: fixed; left: 20px; top: 20px; font: 700 20px system-ui, sans-serif; padding: 14px 32px; border: 0; background: #ffc800; color: #141414; }
    #status { position: fixed; left: 20px; bottom: 20px; padding: 6px 10px; font: 16px system-ui, sans-serif; color: #e0e0e0; background: rgba(0, 0, 0, 0.6); }
  </style>

  <!-- three-phone: Bluetooth and tilt, the same functions as p5-phone -->
  <script src="https://cdn.jsdelivr.net/npm/three-phone@0.3.0/dist/three-phone.min.js"></script>

  <!-- three.js -->
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js" } }
  </script>
</head>
<body>
  <button id="connect">Connect</button>
  <div id="status"></div>

  <!-- make THREE global, then run sketch.js as a plain script -->
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    const s = document.createElement('script');
    s.src = 'sketch.js';
    document.body.appendChild(s);
  </script>
</body>
</html>
