<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 Hand Pose</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101318;
    }
    canvas {
      touch-action: none; /* a finger on the canvas never scrolls the page */
    }
  </style>

  <!-- p5.js 2.x -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>

  <!-- ml5 1.x expects p5 1.x preload counters. These two lines stand in for them in p5 2. -->
  <script>
    p5.prototype._incrementPreload ||= function() {};
    p5.prototype._decrementPreload ||= function() {};
  </script>

  <!-- ml5.js 1.4.0: finds the hand. The sketch asks for runtime: 'mediapipe'. -->
  <script src="https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js"></script>

  <!-- p5-phone: the camera and the permission tap -->
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.4/dist/p5-phone.min.js"></script>

  <!-- helpers, in this folder -->
  <script src="loading.js"></script>
  <script src="camera-switch.js"></script>
  <script src="frame.js"></script>
  <script src="camera-on.js"></script>
</head>
<body>
  <script src="sketch.js"></script>
</body>
</html>
