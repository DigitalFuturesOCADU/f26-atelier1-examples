<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 ArUco Markers</title>
  <style>

      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101318;
    }
    canvas {

  </style>

  <!-- p5.js 2.x -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>

  <!-- helpers, in this folder -->
  <script src="camera-switch.js"></script>
  <script src="frame.js"></script>

  <script src="sketch.js"></script>
